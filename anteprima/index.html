<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Anteprima Goodspark</title>
<style>
  :root { --accent:#f57861; --testo:#1c1c1e; --sec:#6e6e73; --sfondo:#f2f2f7; --card:#fff; --linea:#e5e5ea; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif; background:#e9e4df; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px 16px; color:var(--testo); }
  .telefono { width:390px; max-width:100%; height:min(820px, calc(100vh - 56px)); background:#000; border-radius:56px; padding:12px; }
  .schermo { position:relative; width:100%; height:100%; background:#fff; border-radius:46px; overflow:hidden; display:flex; flex-direction:column; }
  .stato { position:absolute; top:0; left:0; right:0; height:50px; display:flex; justify-content:space-between; align-items:center; padding:6px 30px 0; font-weight:600; font-size:15px; z-index:5; pointer-events:none; }
  .isola { position:absolute; top:11px; left:50%; transform:translateX(-50%); width:120px; height:34px; background:#000; border-radius:20px; z-index:6; }
  .contenuto { flex:1; overflow-y:auto; scrollbar-width:none; }
  .contenuto::-webkit-scrollbar { display:none; }
  .tabbar { display:flex; border-top:.5px solid var(--linea); background:rgba(249,249,249,.95); padding:8px 0 28px; }
  .tab { flex:1; display:flex; flex-direction:column; align-items:center; gap:3px; font-size:10px; color:#999; cursor:pointer; border:0; background:none; font-family:inherit; }
  .tab svg { width:26px; height:26px; }
  .tab.attiva { color:var(--accent); }
  .copertina { height:340px; position:relative; display:flex; align-items:center; justify-content:center; }
  .copertina .emoji { font-size:120px; margin-bottom:40px; }
  .copertina .info { position:absolute; left:20px; bottom:20px; color:#fff; }
  .etichetta { font-size:12px; font-weight:700; letter-spacing:1.2px; text-transform:uppercase; opacity:.9; margin-bottom:6px; }
  .pill { display:inline-block; font-size:13px; font-weight:600; padding:4px 10px; border-radius:20px; background:rgba(255,255,255,.25); }
  .azioni { position:absolute; top:54px; right:16px; display:flex; gap:10px; z-index:4; }
  .azioni button, .indietro { width:38px; height:38px; border-radius:50%; border:0; background:rgba(255,255,255,.85); display:flex; align-items:center; justify-content:center; cursor:pointer; color:var(--accent); }
  .indietro { position:absolute; top:54px; left:16px; z-index:4; }
  .azioni svg, .indietro svg { width:20px; height:20px; }
  .testo { padding:20px 20px 40px; }
  .testo h1 { font-family:"New York",Georgia,serif; font-size:28px; line-height:1.2; margin-bottom:12px; }
  .testo .sotto { font-size:19px; color:var(--sec); line-height:1.35; margin-bottom:14px; }
  .meta { display:flex; gap:14px; font-size:13px; color:var(--sec); padding-bottom:16px; border-bottom:.5px solid var(--linea); margin-bottom:16px; }
  .testo p.par { font-family:"New York",Georgia,serif; font-size:17px; line-height:1.6; margin-bottom:16px; }
  .fonte { background:#f2f2f4; border-radius:14px; padding:16px; margin-top:10px; }
  .fonte b { font-size:12px; color:var(--sec); display:block; margin-bottom:6px; }
  .fonte a { color:var(--accent); font-size:15px; font-weight:500; text-decoration:none; }
  .fonte small { display:block; font-size:12px; color:var(--sec); margin-top:6px; line-height:1.4; }
  .pagina { background:var(--sfondo); min-height:100%; padding:56px 0 20px; }
  .pagina h2 { font-size:34px; font-weight:700; padding:8px 20px 10px; }
  .cerca { margin:0 16px 10px; background:#e3e3e8; border-radius:10px; padding:9px 12px; display:flex; gap:8px; align-items:center; color:var(--sec); }
  .cerca input { border:0; background:none; font-size:17px; flex:1; outline:none; font-family:inherit; }
  .chips { display:flex; gap:8px; overflow-x:auto; padding:4px 16px 12px; scrollbar-width:none; }
  .chip { flex-shrink:0; font-size:15px; font-weight:500; padding:7px 14px; border-radius:20px; background:#e3e3e8; border:0; cursor:pointer; font-family:inherit; color:var(--testo); }
  .chip.sel { background:var(--accent); color:#fff; }
  .lista { background:#fff; margin:0 16px; border-radius:12px; overflow:hidden; }
  .riga { display:flex; gap:14px; align-items:center; padding:10px 14px; border-bottom:.5px solid var(--linea); cursor:pointer; }
  .riga:last-child { border-bottom:0; }
  .riga .ico { width:56px; height:56px; border-radius:14px; display:flex; align-items:center; justify-content:center; font-size:28px; flex-shrink:0; }
  .riga h3 { font-size:16px; font-weight:600; line-height:1.25; }
  .riga span { font-size:12px; color:var(--sec); }
  .riga .freccia { margin-left:auto; color:#c7c7cc; }
  .vuoto { text-align:center; padding:90px 40px; color:var(--sec); }
  .vuoto svg { width:54px; height:54px; margin-bottom:14px; color:#aeaeb2; }
  .vuoto h4 { font-size:22px; color:var(--testo); margin-bottom:8px; }
  .gruppo-titolo { font-size:13px; color:var(--sec); text-transform:uppercase; padding:18px 32px 6px; }
  .gruppo { background:#fff; margin:0 16px; border-radius:12px; padding:0 16px; }
  .gruppo .voce { display:flex; justify-content:space-between; align-items:center; padding:12px 0; border-bottom:.5px solid var(--linea); font-size:17px; }
  .gruppo .voce:last-child { border-bottom:0; }
  .gruppo p { font-size:15px; padding:12px 0; line-height:1.45; }
  .nota { font-size:13px; color:var(--sec); padding:6px 32px 0; line-height:1.4; }
  .interruttore { width:51px; height:31px; border-radius:16px; background:#e9e9eb; position:relative; cursor:pointer; border:0; transition:background .2s; }
  .interruttore::after { content:""; position:absolute; top:2px; left:2px; width:27px; height:27px; border-radius:50%; background:#fff; box-shadow:0 2px 4px rgba(0,0,0,.2); transition:left .2s; }
  .interruttore.on { background:#34c759; }
  .interruttore.on::after { left:22px; }
  .orario { background:#e9e9eb; border-radius:8px; padding:6px 10px; font-size:17px; border:0; font-family:inherit; }
  .notifica { position:absolute; top:56px; left:10px; right:10px; background:rgba(245,245,245,.97); border-radius:20px; padding:12px 14px; display:flex; gap:10px; align-items:center; box-shadow:0 8px 30px rgba(0,0,0,.18); z-index:10; transform:translateY(-200px); transition:transform .4s; }
  .notifica.vista { transform:none; }
  .notifica img { width:38px; height:38px; border-radius:9px; }
  .notifica b { font-size:15px; display:block; }
  .notifica span { font-size:14px; color:#3a3a3c; }
  .lingua { position:fixed; top:14px; right:16px; display:flex; gap:6px; background:#fff; padding:4px; border-radius:22px; box-shadow:0 2px 10px rgba(0,0,0,.08); z-index:20; }
  .lingua button { border:0; background:none; padding:7px 12px; border-radius:18px; font-size:14px; cursor:pointer; font-family:inherit; }
  .lingua button.sel { background:var(--accent); color:#fff; }
  .didascalia { position:fixed; bottom:12px; left:0; right:0; text-align:center; font-size:13px; color:#7a6f66; }
  @media (max-width:430px) { body { padding:0; } .telefono { border-radius:0; padding:0; height:100vh; } .schermo { border-radius:0; } .didascalia { display:none; } }
</style>
</head>
<body>
<div class="telefono">
  <div class="schermo">
    <div class="isola"></div>
    <div class="stato" id="barraStato"><span>9:41</span><span>●●● 100%</span></div>
    <div class="notifica" id="notifica">
      <img src="../app/Goodspark/Assets.xcassets/AppIcon.appiconset/icona.png" alt="">
      <div><b id="notTitolo"></b><span id="notTesto"></span></div>
    </div>
    <div class="contenuto" id="contenuto"></div>
    <nav class="tabbar" id="tabbar"></nav>
  </div>
</div>
<div class="lingua"><button data-l="it" onclick="lingua('it')">🇮🇹 Italiano</button><button data-l="en" onclick="lingua('en')">🇬🇧 English</button></div>
<div class="didascalia" id="didascalia"></div>

<script>
const COLORI = {
  kindness:["#ff9e7a","#fa668c"], community:["#ffbf59","#fa804d"], environment:["#73d18c","#2e9980"],
  animals:["#f2c766","#b3804d"], science:["#73a6ff","#6659e6"], health:["#66d9d9","#408cd9"],
  innovation:["#9980ff","#d966d9"], culture:["#e68cbf","#8c59bf"], sport:["#ff8c4d","#e64d4d"], solidarity:["#ff8c99","#d959a6"]
};
const T = {
  it: { oggi:"Oggi", archivio:"Archivio", preferiti:"Preferiti", impostazioni:"Impostazioni", cerca:"Cerca una storia o un luogo", tutte:"Tutte",
    fonte:"Fonte", leggi:"Leggi l'articolo originale", nota:"Storia raccontata con parole nostre a partire dai fatti riportati dalla fonte, con l'aiuto dell'intelligenza artificiale.",
    nessunRisultato:"Nessun risultato", provaAltro:"Prova con un'altra parola.", nessunPref:"Ancora nessun preferito", nessunPrefTesto:"Tocca il cuore su una storia per ritrovarla qui quando ti serve un sorriso.",
    notifiche:"Notifiche", promemoria:"Promemoria giornaliero", orario:"Orario", notaNotifiche:"Ogni giorno ti ricordiamo che c'è una nuova buona notizia.",
    come:"Come nascono le storie", comeTesto:"Ogni mattina selezioniamo una notizia vera e positiva da fonti giornalistiche affidabili e la raccontiamo con parole nostre, con l'aiuto dell'intelligenza artificiale. In fondo a ogni storia trovi sempre il link all'articolo originale.",
    versione:"Versione", notTitolo:"La buona notizia di oggi ✨", notTesto:"C'è una nuova storia bella che ti aspetta.", condividi:"Qui si apre la condivisione di iPhone (Messaggi, WhatsApp, ecc.)",
    didascalia:"Anteprima interattiva: tocca le schede, apri le storie, metti il cuore", locale:"it-IT",
    cat:{kindness:"Gentilezza",community:"Comunità",environment:"Ambiente",animals:"Animali",science:"Scienza",health:"Salute",innovation:"Innovazione",culture:"Cultura",sport:"Sport",solidarity:"Solidarietà"} },
  en: { oggi:"Today", archivio:"Archive", preferiti:"Favorites", impostazioni:"Settings", cerca:"Search a story or place", tutte:"All",
    fonte:"Source", leggi:"Read the original article", nota:"Story told in our own words from the facts reported by the source, with the help of artificial intelligence.",
    nessunRisultato:"No results", provaAltro:"Try another word.", nessunPref:"No favorites yet", nessunPrefTesto:"Tap the heart on a story to find it here whenever you need a smile.",
    notifiche:"Notifications", promemoria:"Daily reminder", orario:"Time", notaNotifiche:"Every day we'll remind you there's a new piece of good news.",
    come:"How stories are made", comeTesto:"Every morning we pick a true, positive story from trusted news sources and tell it in our own words, with the help of artificial intelligence. At the end of every story you'll always find a link to the original article.",
    versione:"Version", notTitolo:"Today's good news ✨", notTesto:"A new uplifting story is waiting for you.", condividi:"This opens the iPhone share sheet (Messages, WhatsApp, etc.)",
    didascalia:"Interactive preview: tap the tabs, open stories, tap the heart", locale:"en-US",
    cat:{kindness:"Kindness",community:"Community",environment:"Environment",animals:"Animals",science:"Science",health:"Health",innovation:"Innovation",culture:"Culture",sport:"Sport",solidarity:"Solidarity"} }
};
const STORIE = [
  { id:"1", data:"2026-10-18", categoria:"community", emoji:"🍲", min:1,
    it:{ titolo:"Storia di esempio: il quartiere che cucina per tutti", sottotitolo:"Questo è un testo di prova per vedere come appare una storia nell'app.", luogo:"Italia",
      paragrafi:["Questa storia non è reale: serve solo a mostrare come sarà l'app prima che arrivi la prima buona notizia generata automaticamente.","Ogni mattina il sistema sceglierà una notizia vera da fonti affidabili e la racconterà con parole nuove, in tre-cinque paragrafi brevi come questi.","In fondo troverai sempre il nome della fonte e il link all'articolo originale, così chiunque potrà verificare i fatti.","Appena la pipeline sarà attiva, questa pagina verrà sostituita dalla storia del giorno."] },
    en:{ titolo:"Sample story: the neighborhood that cooks for everyone", sottotitolo:"This is placeholder text to show how a story looks in the app.", luogo:"Italy",
      paragrafi:["This story isn't real: it's here only to show what the app will look like before the first automatically generated good news arrives.","Every morning the system will pick a true story from trusted sources and tell it in fresh words, in three to five short paragraphs like these.","At the end you'll always find the source and a link to the original article, so anyone can check the facts.","As soon as the pipeline is running, this page will be replaced by the story of the day."] } },
  { id:"2", data:"2026-10-17", categoria:"environment", emoji:"🌳", min:1,
    it:{ titolo:"Storia di esempio: il bosco che torna a crescere", sottotitolo:"Un secondo esempio, per vedere l'archivio con più storie.", luogo:"Italia",
      paragrafi:["Anche questa è una storia di prova, non una notizia reale.","Nell'archivio le storie appaiono in ordine di data, ognuna con il suo colore in base alla categoria: verde per l'ambiente, azzurro per la scienza, rosa per la gentilezza.","Puoi aggiungerla ai preferiti toccando il cuore in alto, oppure condividerla con chi ha bisogno di un sorriso."] },
    en:{ titolo:"Sample story: the forest growing back", sottotitolo:"A second example, to see the archive with more stories.", luogo:"Italy",
      paragrafi:["This is a placeholder story too, not real news.","In the archive, stories are listed by date, each with its own color by category: green for environment, blue for science, pink for kindness.","You can add it to your favorites by tapping the heart at the top, or share it with someone who needs a smile."] } },
  { id:"3", data:"2026-10-16", categoria:"science", emoji:"🔬", min:1,
    it:{ titolo:"Storia di esempio: una scoperta che fa sperare", sottotitolo:"Esempio della categoria Scienza.", luogo:"Italia", paragrafi:["Storia di prova per mostrare il colore azzurro della categoria Scienza."] },
    en:{ titolo:"Sample story: a hopeful discovery", sottotitolo:"An example from the Science category.", luogo:"Italy", paragrafi:["A placeholder story showing the blue color of the Science category."] } },
  { id:"4", data:"2026-10-15", categoria:"kindness", emoji:"💛", min:1,
    it:{ titolo:"Storia di esempio: il gesto gentile sul treno", sottotitolo:"Esempio della categoria Gentilezza.", luogo:"Italia", paragrafi:["Storia di prova per mostrare il colore rosa della categoria Gentilezza."] },
    en:{ titolo:"Sample story: a kind gesture on the train", sottotitolo:"An example from the Kindness category.", luogo:"Italy", paragrafi:["A placeholder story showing the pink color of the Kindness category."] } },
  { id:"5", data:"2026-10-14", categoria:"animals", emoji:"🐶", min:1,
    it:{ titolo:"Storia di esempio: il cane che ha trovato casa", sottotitolo:"Esempio della categoria Animali.", luogo:"Italia", paragrafi:["Storia di prova per mostrare il colore della categoria Animali."] },
    en:{ titolo:"Sample story: the dog who found a home", sottotitolo:"An example from the Animals category.", luogo:"Italy", paragrafi:["A placeholder story showing the color of the Animals category."] } },
];
const ICONE = {
  oggi:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M11 2.5c.6 4.7 2.8 6.9 7.5 7.5-4.7.6-6.9 2.8-7.5 7.5-.6-4.7-2.8-6.9-7.5-7.5 4.7-.6 6.9-2.8 7.5-7.5z"/><path d="M18.5 14c.3 2.3 1.2 3.2 3.5 3.5-2.3.3-3.2 1.2-3.5 3.5-.3-2.3-1.2-3.2-3.5-3.5 2.3-.3 3.2-1.2 3.5-3.5z"/></svg>',
  archivio:'<svg viewBox="0 0 24 24" fill="currentColor"><rect x="3" y="4" width="4" height="16" rx="1"/><rect x="9" y="4" width="4" height="16" rx="1"/><rect x="15.5" y="4.5" width="4" height="16" rx="1" transform="rotate(-12 17.5 12.5)"/></svg>',
  cuore:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 21s-7.5-4.6-9.6-9.3C.9 8.2 3 4.5 6.6 4.5c2.1 0 3.6 1.2 4.4 2.5.8-1.3 2.3-2.5 4.4-2.5 3.6 0 5.7 3.7 4.2 7.2C19.5 16.4 12 21 12 21z"/></svg>',
  cuoreVuoto:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20s-7-4.3-9-8.7C1.6 8 3.6 4.8 6.8 4.8c2 0 3.4 1.1 4.2 2.4.8-1.3 2.2-2.4 4.2-2.4 3.2 0 5.2 3.2 3.8 6.5C17 15.7 12 20 12 20z"/></svg>',
  impostazioni:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M19.4 13a7.5 7.5 0 0 0 0-2l2.1-1.6-2-3.4-2.5 1a7 7 0 0 0-1.7-1L15 3.3h-4l-.4 2.7a7 7 0 0 0-1.7 1l-2.5-1-2 3.4L6.6 11a7.5 7.5 0 0 0 0 2l-2.1 1.6 2 3.4 2.5-1a7 7 0 0 0 1.7 1l.4 2.7h4l.4-2.7a7 7 0 0 0 1.7-1l2.5 1 2-3.4zM12 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7z"/></svg>',
  condividi:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M7.5 7.5 12 3l4.5 4.5M5 12v8h14v-8"/></svg>',
  indietro:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>',
};
const TAB = [["oggi","oggi"],["archivio","archivio"],["preferiti","cuore"],["impostazioni","impostazioni"]];
const stato = { lingua:"it", tab:"oggi", aperta:null, preferiti:new Set(), ricerca:"", categoria:null, promemoria:false, ora:"08:00" };
const $ = id => document.getElementById(id);
const t = k => T[stato.lingua][k];
const testo = s => s[stato.lingua];
const nomeCat = c => T[stato.lingua].cat[c];
const data = s => new Date(s.data + "T12:00:00").toLocaleDateString(t("locale"), { day:"numeric", month:"long", year:"numeric" });
const grad = c => `linear-gradient(135deg, ${COLORI[c][0]}, ${COLORI[c][1]})`;

function vistaStoria(s, conIndietro) {
  const pref = stato.preferiti.has(s.id), x = testo(s);
  return `${conIndietro ? `<button class="indietro" onclick="chiudi()" aria-label="Back">${ICONE.indietro}</button>` : ""}
  <div class="azioni">
    <button onclick="cuore('${s.id}')" aria-label="Favorite">${pref ? ICONE.cuore : ICONE.cuoreVuoto}</button>
    <button onclick="alert(t('condividi'))" aria-label="Share">${ICONE.condividi}</button>
  </div>
  <div class="copertina" style="background:${grad(s.categoria)}">
    <div class="emoji">${s.emoji}</div>
    <div class="info"><div class="etichetta">${data(s)}</div><span class="pill">${nomeCat(s.categoria)}</span></div>
  </div>
  <div class="testo">
    <h1>${x.titolo}</h1>
    <p class="sotto">${x.sottotitolo}</p>
    <div class="meta"><span>📍 ${x.luogo}</span><span>🕐 ${s.min} min</span></div>
    ${x.paragrafi.map(p => `<p class="par">${p}</p>`).join("")}
    <div class="fonte"><b>${t("fonte")}</b><a href="#" onclick="return false">↗ ${t("leggi")}</a><small>${t("nota")}</small></div>
  </div>`;
}

function riga(s) {
  return `<div class="riga" onclick="apri('${s.id}')">
    <div class="ico" style="background:${grad(s.categoria)}">${s.emoji}</div>
    <div><h3>${testo(s).titolo}</h3><span>${data(s)} · ${testo(s).luogo}</span></div><div class="freccia">›</div></div>`;
}

function vistaArchivio() {
  const q = stato.ricerca.toLowerCase();
  const filtrate = STORIE.filter(s => (!stato.categoria || s.categoria === stato.categoria) &&
    (!q || (testo(s).titolo + testo(s).luogo + testo(s).sottotitolo).toLowerCase().includes(q)));
  const cat = [...new Set(STORIE.map(s => s.categoria))].sort((a, b) => nomeCat(a).localeCompare(nomeCat(b)));
  return `<div class="pagina"><h2>${t("archivio")}</h2>
    <div class="cerca">🔍<input id="campoRicerca" placeholder="${t("cerca")}" value="${stato.ricerca}" oninput="cerca(this.value)"></div>
    <div class="chips"><button class="chip ${!stato.categoria ? "sel" : ""}" onclick="filtra(null)">${t("tutte")}</button>
      ${cat.map(c => `<button class="chip ${stato.categoria === c ? "sel" : ""}" onclick="filtra('${c}')">${nomeCat(c)}</button>`).join("")}</div>
    ${filtrate.length ? `<div class="lista">${filtrate.map(riga).join("")}</div>` : `<div class="vuoto"><h4>${t("nessunRisultato")}</h4>${t("provaAltro")}</div>`}
  </div>`;
}

function vistaPreferiti() {
  const pref = STORIE.filter(s => stato.preferiti.has(s.id));
  return `<div class="pagina"><h2>${t("preferiti")}</h2>
    ${pref.length ? `<div class="lista">${pref.map(riga).join("")}</div>`
      : `<div class="vuoto">${ICONE.cuoreVuoto}<h4>${t("nessunPref")}</h4>${t("nessunPrefTesto")}</div>`}
  </div>`;
}

function vistaImpostazioni() {
  return `<div class="pagina"><h2>${t("impostazioni")}</h2>
    <div class="gruppo-titolo">${t("notifiche")}</div>
    <div class="gruppo">
      <div class="voce">${t("promemoria")}<button class="interruttore ${stato.promemoria ? "on" : ""}" onclick="promemoria()" aria-label="Reminder"></button></div>
      ${stato.promemoria ? `<div class="voce">${t("orario")}<input type="time" class="orario" value="${stato.ora}" onchange="stato.ora=this.value"></div>` : ""}
    </div>
    <p class="nota">${t("notaNotifiche")}</p>
    <div class="gruppo-titolo">${t("come")}</div>
    <div class="gruppo"><p>${t("comeTesto")}</p></div>
    <div class="gruppo-titolo">&nbsp;</div>
    <div class="gruppo"><div class="voce">${t("versione")}<span style="color:var(--sec)">1.0</span></div></div>
  </div>`;
}

function disegna() {
  const c = $("contenuto");
  const storia = stato.aperta && STORIE.find(s => s.id === stato.aperta);
  if (storia) c.innerHTML = vistaStoria(storia, true);
  else if (stato.tab === "oggi") c.innerHTML = vistaStoria(STORIE[0], false);
  else if (stato.tab === "archivio") c.innerHTML = vistaArchivio();
  else if (stato.tab === "preferiti") c.innerHTML = vistaPreferiti();
  else c.innerHTML = vistaImpostazioni();
  $("barraStato").style.color = (storia || stato.tab === "oggi") ? "#fff" : "#000";
  $("tabbar").innerHTML = TAB.map(([id, ico]) =>
    `<button class="tab ${stato.tab === id ? "attiva" : ""}" onclick="vai('${id}')">${ICONE[ico]}${t(id)}</button>`).join("");
  $("notTitolo").textContent = t("notTitolo");
  $("notTesto").textContent = t("notTesto");
  $("didascalia").textContent = t("didascalia");
  document.querySelectorAll(".lingua button").forEach(b => b.classList.toggle("sel", b.dataset.l === stato.lingua));
  document.documentElement.lang = stato.lingua;
}
function lingua(l) { stato.lingua = l; disegna(); }
function vai(x) { stato.tab = x; stato.aperta = null; $("contenuto").scrollTop = 0; disegna(); }
function apri(id) { stato.aperta = id; $("contenuto").scrollTop = 0; disegna(); }
function chiudi() { stato.aperta = null; disegna(); }
function cuore(id) { stato.preferiti.has(id) ? stato.preferiti.delete(id) : stato.preferiti.add(id); disegna(); }
function filtra(c) { stato.categoria = c; disegna(); }
function cerca(v) { stato.ricerca = v; disegna(); const i = $("campoRicerca"); i.focus(); i.setSelectionRange(v.length, v.length); }
function promemoria() {
  stato.promemoria = !stato.promemoria; disegna();
  if (stato.promemoria) { $("notifica").classList.add("vista"); setTimeout(() => $("notifica").classList.remove("vista"), 3200); }
}
disegna();
</script>
</body>
</html>
