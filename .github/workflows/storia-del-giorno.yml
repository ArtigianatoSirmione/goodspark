# Ogni mattina genera la buona notizia del giorno e la pubblica su GitHub Pages.
name: Storia del giorno

on:
  schedule:
    - cron: "0 4 * * *"   # 04:00 UTC = 05:00/06:00 in Italia
  workflow_dispatch:       # permette di lanciarla anche a mano da GitHub
    inputs:
      forza:
        description: "Rigenera le storie di oggi"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: storia-del-giorno
  cancel-in-progress: false

jobs:
  genera:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - run: pip install -r pipeline/requirements.txt

      - name: Installa il convertitore per le illustrazioni
        run: sudo apt-get update -qq && sudo apt-get install -y -qq librsvg2-bin

      - name: Genera la storia
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python pipeline/genera_storia.py ${{ inputs.forza && '--forza' || '' }}

      - name: Pubblica
        run: |
          git add docs/
          if git diff --cached --quiet; then
            echo "Nessuna nuova storia oggi."
            exit 0
          fi
          git config user.name "storia-del-giorno[bot]"
          git config user.email "storia-del-giorno@users.noreply.github.com"
          git commit -m "Storia del $(TZ=Europe/Rome date +%F)"
          git push
